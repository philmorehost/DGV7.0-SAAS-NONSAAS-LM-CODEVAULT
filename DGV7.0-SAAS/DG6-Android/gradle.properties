org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The Kotlin compiler runs in its own persistent daemon process that does NOT inherit
# org.gradle.jvmargs above — without this, it falls back to the build machine's default
# platform charset (commonly Windows-1252 on Windows), which silently mangles any
# non-ASCII literal (e.g. the Naira "₦" symbol) baked into .kt source at compile time.
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
