name: Mobile Apps Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # ─── ANDROID BUILD MATRIX ──────────────────────────────────────────
  android-builds:
    name: Build Android (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          # Only the currently-updated apps are built to keep the pipeline fast.
          - "ANDROID - iOS/MZEEVTU-Android"
          - "ANDROID - iOS/DG7-Android"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for Gradle Wrapper
      run: |
        chmod +x "${{ matrix.project }}/gradlew" || true
        # Restore a real Gradle wrapper if the local one is a simulation stub
        if [ ! -f "${{ matrix.project }}/gradlew" ] || grep -q "Simulation" "${{ matrix.project }}/gradlew"; then
          echo "Restoring functional Gradle Wrapper..."
          gradle wrapper --gradle-version 8.0 --project-dir "${{ matrix.project }}"
          chmod +x "${{ matrix.project }}/gradlew"
        fi

    - name: Build Debug APK
      run: |
        cd "${{ matrix.project }}"
        ./gradlew assembleDebug --no-daemon --stacktrace

    # Each Android app signs its own release build with per-app secrets. The build.gradle
    # files read the generic KEYSTORE_* env vars; the workflow maps each app's secret names
    # to them so no two apps collide. Release builds REQUIRE the keystore — if a secret is
    # missing the step fails (the debug-sign fallback has been removed so a wrong-signed AAB
    # can never be produced).
    - name: Build & Sign Release APK + AAB (PayHub Guest)
      if: matrix.project == 'ANDROID - iOS/PayHub-Guest-Android'
      env:
        KEYSTORE_BASE64: ${{ secrets.GUEST_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.GUEST_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.GUEST_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.GUEST_KEY_PASSWORD }}
      run: |
        cd "${{ matrix.project }}"
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::GUEST_KEYSTORE_BASE64 secret is not set — release builds REQUIRE a keystore (debug-sign fallback removed)."
          exit 1
        fi
        ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

    - name: Build & Sign Release APK + AAB (DG7-Android)
      if: matrix.project == 'ANDROID - iOS/DG7-Android'
      env:
        KEYSTORE_BASE64: ${{ secrets.DG7_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.DG7_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.DG7_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.DG7_KEY_PASSWORD }}
      run: |
        cd "${{ matrix.project }}"
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::DG7_KEYSTORE_BASE64 secret is not set — release builds REQUIRE a keystore (debug-sign fallback removed)."
          exit 1
        fi
        ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

    - name: Build & Sign Release APK + AAB (MZEEVTU-Android)
      if: matrix.project == 'ANDROID - iOS/MZEEVTU-Android'
      env:
        KEYSTORE_BASE64: ${{ secrets.MZEEVTU_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.MZEEVTU_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.MZEEVTU_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.MZEEVTU_KEY_PASSWORD }}
      run: |
        cd "${{ matrix.project }}"
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::MZEEVTU_KEYSTORE_BASE64 secret is not set — release builds REQUIRE a keystore (debug-sign fallback removed)."
          exit 1
        fi
        ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

    - name: Prepare Artifact Name
      id: artifact-name
      run: |
        # Strip path prefix to just get the app name
        APP_NAME=$(basename "${{ matrix.project }}")
        echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-Debug-APK
        path: ${{ matrix.project }}/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn

    - name: Upload Release APK (DG7-Android, MZEEVTU-Android, PayHub Guest)
      if: matrix.project == 'ANDROID - iOS/PayHub-Guest-Android' || matrix.project == 'ANDROID - iOS/DG7-Android' || matrix.project == 'ANDROID - iOS/MZEEVTU-Android'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-Release-APK
        path: ${{ matrix.project }}/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: warn

    - name: Upload Release AAB (Android App Bundle)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-Release-AAB
        path: ${{ matrix.project }}/app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: warn

  # ─── IOS BUILD MATRIX ──────────────────────────────────────────────
  ios-builds:
    name: Build iOS (${{ matrix.project }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          # Only the currently-updated apps are built to keep the pipeline fast.
          - "ANDROID - iOS/MZEEVTU-iOS"
          - "ANDROID - iOS/DG7-iOS"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Generate Xcode project (XcodeGen, if project.yml exists)
      run: |
        cd "${{ matrix.project }}"
        if [ -f "project.yml" ]; then
          echo "project.yml found — generating a real .xcodeproj via XcodeGen..."
          brew install xcodegen
          xcodegen generate
        else
          echo "No project.yml in ${{ matrix.project }} — skipping (falls through to the source-archiving step below)."
        fi

    - name: Prepare Artifact Name
      id: artifact-name
      run: |
        # Strip path prefix to just get the app name
        APP_NAME=$(basename "${{ matrix.project }}")
        echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

    - name: Clean and Archive iOS App (Unsigned)
      run: |
        cd "${{ matrix.project }}"
        APP_NAME=$(basename "${{ matrix.project }}")
        
        if ls *.xcodeproj > /dev/null 2>&1 || ls */*.xcodeproj > /dev/null 2>&1; then
          echo "Xcode project found. Building archive..."
          xcodebuild clean archive \
            -scheme "$APP_NAME" \
            -archivePath build/$APP_NAME.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO || true
        else
          echo "No Xcode project found in ${{ matrix.project }}. Packaging Swift source files."
          mkdir -p build/$APP_NAME.xcarchive
          find . -name "*.swift" -o -name "*.plist" | head -50 > build/$APP_NAME.xcarchive/source_manifest.txt
          echo "iOS source archive — awaiting Xcode project setup" > build/$APP_NAME.xcarchive/release.txt
        fi

    - name: Compress Archive Package
      run: |
        cd "${{ matrix.project }}"
        APP_NAME=$(basename "${{ matrix.project }}")
        if [ -d "build/$APP_NAME.xcarchive" ]; then
          zip -r $APP_NAME-Archive.zip build/$APP_NAME.xcarchive
        fi

    - name: Upload iOS Archive
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-iOS-Archive
        path: ${{ matrix.project }}/*-Archive.zip
        if-no-files-found: warn
