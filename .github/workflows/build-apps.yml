name: Mobile Apps Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # ─── ANDROID BUILD MATRIX ──────────────────────────────────────────
  android-builds:
    name: Build Android (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          # Every Android app is built. JIKABIZ and PayHub Guest were previously absent from
          # this list, so CI never compiled or signed them at all.
          - "ANDROID - iOS/DG7-Android"
          - "ANDROID - iOS/MZEEVTU-Android"
          - "ANDROID - iOS/JIKABIZ-Android"
          - "ANDROID - iOS/PayHub-Guest-Android"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for Gradle Wrapper
      run: |
        chmod +x "${{ matrix.project }}/gradlew" || true
        # Restore a real Gradle wrapper if the local one is a simulation stub
        if [ ! -f "${{ matrix.project }}/gradlew" ] || grep -q "Simulation" "${{ matrix.project }}/gradlew"; then
          echo "Restoring functional Gradle Wrapper..."
          gradle wrapper --gradle-version 8.0 --project-dir "${{ matrix.project }}"
          chmod +x "${{ matrix.project }}/gradlew"
        fi

    - name: Build Debug APK
      run: |
        cd "${{ matrix.project }}"
        ./gradlew assembleDebug --no-daemon --stacktrace

    # Each Android app signs its own release build with per-app secrets. The build.gradle
    # files read the generic KEYSTORE_* env vars; the workflow maps each app's secret names
    # to them so no two apps collide. Release builds REQUIRE the keystore — if a secret is
    # missing the step fails (the debug-sign fallback has been removed so a wrong-signed AAB
    # can never be produced).
    - name: Build & Sign Release APK + AAB (PayHub Guest)
      if: matrix.project == 'ANDROID - iOS/PayHub-Guest-Android'
      env:
        KEYSTORE_BASE64: ${{ secrets.GUEST_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.GUEST_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.GUEST_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.GUEST_KEY_PASSWORD }}
      run: |
        cd "${{ matrix.project }}"
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::warning::GUEST_KEYSTORE_BASE64 is not set — skipping the signed release build. The debug APK is still built and uploaded. Add this repository secret to publish a release APK/AAB; a debug-signed release is never produced."
          exit 0
        fi
        ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

    - name: Build & Sign Release APK + AAB (DG7-Android)
      if: matrix.project == 'ANDROID - iOS/DG7-Android'
      env:
        KEYSTORE_BASE64: ${{ secrets.DG7_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.DG7_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.DG7_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.DG7_KEY_PASSWORD }}
      run: |
        cd "${{ matrix.project }}"
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::warning::DG7_KEYSTORE_BASE64 is not set — skipping the signed release build. The debug APK is still built and uploaded. Add this repository secret to publish a release APK/AAB; a debug-signed release is never produced."
          exit 0
        fi
        ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

    - name: Build & Sign Release APK + AAB (MZEEVTU-Android)
      if: matrix.project == 'ANDROID - iOS/MZEEVTU-Android'
      env:
        KEYSTORE_BASE64: ${{ secrets.MZEEVTU_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.MZEEVTU_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.MZEEVTU_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.MZEEVTU_KEY_PASSWORD }}
      run: |
        cd "${{ matrix.project }}"
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::warning::MZEEVTU_KEYSTORE_BASE64 is not set — skipping the signed release build. The debug APK is still built and uploaded. Add this repository secret to publish a release APK/AAB; a debug-signed release is never produced."
          exit 0
        fi
        ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

    - name: Build & Sign Release APK + AAB (JIKABIZ-Android)
      if: matrix.project == 'ANDROID - iOS/JIKABIZ-Android'
      env:
        KEYSTORE_BASE64: ${{ secrets.JIKABIZ_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.JIKABIZ_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.JIKABIZ_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.JIKABIZ_KEY_PASSWORD }}
      run: |
        cd "${{ matrix.project }}"
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::warning::JIKABIZ_KEYSTORE_BASE64 is not set — skipping the signed release build. The debug APK is still built and uploaded. Add this repository secret to publish a release APK/AAB; a debug-signed release is never produced."
          exit 0
        fi
        ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

    - name: Prepare Artifact Name
      id: artifact-name
      run: |
        # Strip path prefix to just get the app name
        APP_NAME=$(basename "${{ matrix.project }}")
        echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-Debug-APK
        path: ${{ matrix.project }}/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn

    - name: Upload Release APK
      # No `if`: every app is signed now. `if-no-files-found: warn` keeps the job green
      # when the signing secret is absent and the release build was skipped above.
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-Release-APK
        path: ${{ matrix.project }}/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: warn

    - name: Upload Release AAB (Android App Bundle)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-Release-AAB
        path: ${{ matrix.project }}/app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: warn

  # ─── IOS BUILD MATRIX ──────────────────────────────────────────────
  ios-builds:
    name: Build iOS (${{ matrix.project }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          # Every iOS app is built. JIKABIZ and PayHub Guest were previously absent.
          - "ANDROID - iOS/DG7-iOS"
          - "ANDROID - iOS/MZEEVTU-iOS"
          - "ANDROID - iOS/JIKABIZ-iOS"
          - "ANDROID - iOS/PayHub-Guest-iOS"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Generate Xcode project (XcodeGen, if project.yml exists)
      run: |
        cd "${{ matrix.project }}"
        if [ -f "project.yml" ]; then
          echo "project.yml found — generating a real .xcodeproj via XcodeGen..."
          brew install xcodegen
          xcodegen generate
          # The scheme is XcodeGen's `name:` key, which is NOT always the directory name
          # (PayHub-Guest-iOS generates the scheme "PayHubGuest"). Resolving it here is what
          # makes the archive step target the right scheme instead of silently failing.
          SCHEME=$(sed -n 's/^name:[[:space:]]*//p' project.yml | head -1 | tr -d '\r')
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Resolved XcodeGen scheme: $SCHEME"
        else
          echo "::warning::No project.yml in ${{ matrix.project }} — this app cannot be built. Add an XcodeGen project.yml so it produces an .xcodeproj."
        fi

    - name: Prepare Artifact Name
      id: artifact-name
      run: |
        # Strip path prefix to just get the app name
        APP_NAME=$(basename "${{ matrix.project }}")
        echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

    - name: Clean and Archive iOS App (Unsigned)
      run: |
        cd "${{ matrix.project }}"
        APP_NAME=$(basename "${{ matrix.project }}")
        
        if [ -n "$SCHEME" ]; then
          echo "Archiving scheme $SCHEME..."
          # `|| true` deliberately removed: it masked genuine build failures and left empty
          # artifacts, which is exactly why these jobs looked green while building nothing.
          xcodebuild clean archive \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -archivePath "build/$SCHEME.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO
        else
          echo "::warning::No Xcode project was generated for ${{ matrix.project }} — skipping the archive. (This branch used to fabricate an empty 'xcarchive' holding a file list, which is why the job reported success while building nothing.)"
        fi

    - name: Compress Archive Package
      run: |
        cd "${{ matrix.project }}"
        APP_NAME=$(basename "${{ matrix.project }}")
        if [ -n "$SCHEME" ] && [ -d "build/$SCHEME.xcarchive" ]; then
          zip -r "$APP_NAME-Archive.zip" "build/$SCHEME.xcarchive"
        fi

    - name: Upload iOS Archive
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-iOS-Archive
        path: ${{ matrix.project }}/*-Archive.zip
        if-no-files-found: warn
