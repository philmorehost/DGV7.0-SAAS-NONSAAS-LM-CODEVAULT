# XcodeGen configuration for DG7-iOS.
# Generates a real .xcodeproj so the app can be archived/signed.
# Bundle identifier: com.datagifting.app (matches DG7-Android applicationId).
# Build: xcodegen generate  (CI runs this automatically when project.yml exists)
name: DG7-iOS

options:
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  DG7-iOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - DG6-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datagifting.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
